services:
  app:
    image: ghcr.io/suryaelidanto/umkmcepat-app:${APP_IMAGE_TAG:-latest}
    container_name: umkmcepat-app
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      9router:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-umkmcepat}?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-http://9router:20128/v1}
      STORAGE_PROVIDER: local
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-umkmcepat}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-umkmcepat_s3_secret_key_prod}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-umkmcepat-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-umkmcepat-private}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://umkmcepat.com}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-umkmcepat}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-umkmcepat_s3_secret_key_prod}
      LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-/app/.data/uploads}
      MAYAR_API_BASE_URL: ${MAYAR_API_BASE_URL:-https://api.mayar.id/hl/v2}
      GENERATED_BUILD_EXECUTION_ENABLED: ${GENERATED_BUILD_EXECUTION_ENABLED:-true}
      GENERATED_PUBLIC_EXECUTION_ENABLED: ${GENERATED_PUBLIC_EXECUTION_ENABLED:-true}
      GENERATED_PUBLIC_ORIGIN: ${GENERATED_PUBLIC_ORIGIN:-}
      PROJECT_ARTIFACT_STORAGE_PROVIDER: local
      PROJECT_ARTIFACT_DIR: /app/.data/project-artifacts
      PROJECT_THUMBNAIL_DIR: /app/.data/project-thumbnails
      PROJECT_THUMBNAIL_CAPTURE_ENABLED: "true"
      PROJECT_THUMBNAIL_BROWSER_PATH: /usr/bin/chromium-browser
      PROJECT_THUMBNAIL_CONCURRENCY: ${PROJECT_THUMBNAIL_CONCURRENCY:-1}
      PROJECT_THUMBNAIL_TIMEOUT_MS: ${PROJECT_THUMBNAIL_TIMEOUT_MS:-15000}
      PROJECT_ARTIFACT_R2_PREFIX: ${PROJECT_ARTIFACT_R2_PREFIX:-project-artifacts}
      PROJECT_RUNTIME_SUPERVISOR: noop
      PROJECT_RUNTIME_ALLOWED_HOSTS: ${PROJECT_RUNTIME_ALLOWED_HOSTS:-127.0.0.1,localhost}
      PROJECT_RUNTIME_HEALTH_TIMEOUT_MS: ${PROJECT_RUNTIME_HEALTH_TIMEOUT_MS:-2000}
      PROJECT_RUNTIME_PROXY_TIMEOUT_MS: ${PROJECT_RUNTIME_PROXY_TIMEOUT_MS:-15000}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3000/api/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    volumes:
      - uploads:/app/.data/uploads
      - project_artifacts:/app/.data/project-artifacts
      - project_thumbnails:/app/.data/project-thumbnails

  migrate:
    image: ghcr.io/suryaelidanto/umkmcepat-app:${APP_IMAGE_TAG:-latest}
    container_name: umkmcepat-migrate
    restart: "no"
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-umkmcepat}?schema=public
    command: ["bunx", "prisma", "migrate", "deploy"]

  9router:
    image: docker.io/decolua/9router:latest
    container_name: umkmcepat-9router
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    depends_on:
      - headroom
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BASE_URL: ${NINE_ROUTER_PUBLIC_URL:-http://localhost:20129}
      INITIAL_PASSWORD: ${NINE_ROUTER_INITIAL_PASSWORD:?NINE_ROUTER_INITIAL_PASSWORD is required}
    ports:
      - "127.0.0.1:20129:20128"
    volumes:
      - nine_router_data:/app/data

  headroom:
    build:
      context: .
      dockerfile: Dockerfile.headroom
    container_name: umkmcepat-headroom
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    environment:
      HEADROOM_TELEMETRY: off

  redis:
    image: docker.io/redis:7-alpine
    container_name: umkmcepat-redis
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    volumes:
      - redis_data:/data

  minio:
    image: docker.io/minio/minio:latest
    container_name: umkmcepat-minio
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-umkmcepat}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-umkmcepat_s3_secret_key_prod}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  postgres:
    image: docker.io/postgres:16-alpine
    container_name: umkmcepat-postgres
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-umkmcepat}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init-umami.sql:/docker-entrypoint-initdb.d/10-create-umami-db.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-umkmcepat}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Usage/behavior analytics (shares the platform Postgres).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Availability monitoring (standalone SQLite; pings the app + key endpoints).
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3002:3001"
    restart: unless-stopped

  # Ingress. No inbound ports are opened on the host; cloudflared dials out to
  # Cloudflare and traffic arrives over that connection. Every other service
  # stays bound to 127.0.0.1.
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: umkmcepat-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nine_router_data:
  project_artifacts:
  project_thumbnails:
  uploads:
  uptime_kuma_data:
