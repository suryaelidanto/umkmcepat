services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: umkmcepat-postgres
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: umkmcepat
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d umkmcepat"]
      interval: 10s
      timeout: 5s
      retries: 5

  9router:
    image: docker.io/decolua/9router:latest
    container_name: umkmcepat-9router
    restart: unless-stopped
    # Public DNS: rootless podman aardvark-dns can't forward to the host's
    # systemd-resolved (127.0.0.53); pin resolvers reachable by IP.
    dns: ["1.1.1.1", "8.8.8.8"]
    profiles:
      - ai
    depends_on:
      - headroom
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BASE_URL: http://localhost:20129
    ports:
      - "127.0.0.1:20129:20128"
    volumes:
      - nine_router_data:/app/data

  headroom:
    build:
      context: .
      dockerfile: Dockerfile.headroom
    container_name: umkmcepat-headroom
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    profiles:
      - ai
    environment:
      HEADROOM_TELEMETRY: off
    ports:
      - "127.0.0.1:8787:8787"

  # Always on (no profile): BullMQ attempt queue needs Redis for generate/edit.
  redis:
    image: docker.io/redis:7-alpine
    container_name: umkmcepat-redis
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: docker.io/minio/minio:latest
    container_name: umkmcepat-minio
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-umkmcepat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-umkmcepat}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    profiles:
      - ai

volumes:
  postgres_data:
  nine_router_data:
  redis_data:
  minio_data:
