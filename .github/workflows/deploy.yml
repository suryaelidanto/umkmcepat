name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/suryaelidanto/umkmcepat-app:latest
            ghcr.io/suryaelidanto/umkmcepat-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to VPS
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "=== 1. Authenticating to GHCR on VPS ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== 1.1 Freeing disk space on VPS ==="
            docker image prune -af --filter "until=48h" || true
            docker builder prune -af --filter "until=48h" || true

            echo "=== 2. Pulling latest images ==="
            cd /opt/umkmcepat
            docker compose pull app migrate

            echo "=== 3. Rolling update containers ==="
            docker compose up -d --remove-orphans

            echo "=== 3.1 Pruning old superseded images ==="
            docker image prune -f || true

            echo "=== 4. Verifying container health ==="
            sleep 5
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
