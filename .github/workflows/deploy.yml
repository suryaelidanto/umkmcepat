name: Deploy

# BACKUP / DISABLED — ready for when the VPS is provisioned.
# This workflow is manual-only (workflow_dispatch) so it stays inert on every
# push. When the VPS is ready, uncomment the `push:` block below (or a tag
# trigger like `on: push: tags: ["v*"]`) to auto-deploy on release. Until then
# it does nothing unless you click "Run workflow" in the Actions tab (and even
# then it needs DEPLOY_* secrets configured for a real VPS).
#
# on:
#   push:
#     branches: [main]
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha) to deploy"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Job 1: build the production image and push it to GHCR so the VPS can pull
  # a prebuilt image instead of building on the (small) VPS.
  build-and-push:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install deps
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Quality gate (format/lint/typecheck/test/knip)
        run: bun run verify

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/umkmcepat-app:latest
            ghcr.io/${{ github.repository_owner }}/umkmcepat-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export deployed tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # Job 2: SSH into the VPS, pull the new image, and roll the prod compose.
  # Stays inert until DEPLOY_HOST / DEPLOY_SSH_KEY / DEPLOY_USER secrets exist
  # and the VPS is provisioned.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          envs: APP_IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Record what is running now so the rollback below can restore it.
            PREVIOUS_TAG="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' umkmcepat-app 2>/dev/null || echo '')"
            echo "previous_tag=${PREVIOUS_TAG:-none}"

            export APP_IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull app migrate
            docker compose -f docker-compose.prod.yml up -d

            # Gate on readiness; roll back if the new image cannot serve.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/api/health/ready >/dev/null; then
                echo "ready"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done

            echo "readiness check failed; rolling back"
            if [ -n "$PREVIOUS_TAG" ]; then
              APP_IMAGE_TAG="$PREVIOUS_TAG" docker compose -f docker-compose.prod.yml up -d
            fi
            exit 1
        env:
          APP_IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
